<body class="login-page">

Food Check UMKM

<p>

</p>





<form id="loginForm">



<label>
Username
</label>


<input 
id="username"
name="username"
placeholder="Masukkan username"

required
>





<label>
Password
</label>


<input 
id="password"
name="password"
type="password"
placeholder="Masukkan password"
autocomplete="current-password"
required
>

🔐 Masuk
</button>



</form>





<p>
