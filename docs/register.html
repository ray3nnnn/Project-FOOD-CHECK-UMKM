<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Register - Food Check UMKM
</title>


<link rel="stylesheet" href="css/style.css">


</head>


<body class="register-page">



<!-- LOADING -->

<div id="loading">


<div class="loader">

🛡️

</div>


<h3>
Food Check UMKM
</h3>


<p>
Menyiapkan akun...
</p>


<div class="loading-bar">

<span></span>

</div>


</div>





<div class="register-wrapper">



<!-- FLOATING EMOJI -->


<div class="food-floating">


<span>🥕</span>
<span>🥦</span>
<span>🍅</span>
<span>🥒</span>
<span>🧄</span>
<span>🌶️</span>
<span>🫑</span>
<span>🍎</span>


</div>







<!-- REGISTER CARD -->


<div class="register-card">



<div class="login-logo">

🛡️

</div>




<h2>

Food Check UMKM

</h2>


<p>

Buat akun baru

</p>






<label>

Nama Lengkap

</label>


<input

id="nama"

placeholder="Masukkan nama lengkap"

>







<label>

Username

</label>


<input

id="username"

placeholder="Masukkan username"

>








<label>
Password
</label>


<div class="password-wrapper">


<input
id="password"
type="password"
placeholder="Masukkan password"
>


<div 
class="eye"
onclick="togglePassword()">

👁

</div>


</div>







<button onclick="register()">


📝 Daftar


</button>







<div class="register-link">


Sudah punya akun?


<a href="index.html">

Login sekarang

</a>


</div>





</div>






</div>




<div id="toast"></div>




<script src="js/config.js"></script>

<script src="js/toast.js"></script>

<script src="js/register.js"></script>



<script>


// SHOW PASSWORD


function togglePassword(){


const pass =
document.getElementById("password");


if(pass.type === "password"){


pass.type="text";


}

else{


pass.type="password";


}


}





// LOADING


window.addEventListener(
"load",
()=>{


setTimeout(()=>{


document
.getElementById("loading")
.classList.add("hide");



const wrapper =
document.querySelector(".register-wrapper");


if(wrapper){

    wrapper.classList.add("show");

}



},1500);



});


</script>



</body>


</html>
