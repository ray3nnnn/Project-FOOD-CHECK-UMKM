<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Pemeriksaan Makanan - Food Check UMKM
</title>


<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="layout">


<!-- ======================
SIDEBAR
====================== -->


<div class="sidebar">


<div class="brand">

<h2>
🛡 Food Check
</h2>

<p>
UMKM
</p>

</div>




<div class="profile">


<div class="avatar" id="avatar">

</div>


<div>

<b id="sidebarNama">
</b>


<small id="sidebarRole">
</small>


</div>


</div>





<div class="menu">


<button onclick="location.href='dashboard.html'">

🏠 Dashboard

</button>



<button class="active">

🍜 Pemeriksaan

</button>



<button onclick="location.href='riwayat.html'">

📋 Riwayat Pemeriksaan

</button>


</div>





<button 
class="logout"
onclick="logout()">

🚪 Logout

</button>



</div>









<!-- ======================
CONTENT
====================== -->


<div class="content">


<h1>
🍜 Pemeriksaan Makanan
</h1>


<p>
Isi data pemeriksaan keamanan pangan produk UMKM.
</p>






<div class="manage pemeriksaan-box">



<div class="form-header">


<h2>
📝 Form Pemeriksaan
</h2>


<p>
Lengkapi informasi makanan dengan benar.
</p>



</div>







<form id="formPemeriksaan">



<div class="form-grid">



<div>

<label>
🍜 Nama Makanan
</label>


<input

id="nama_makanan"

placeholder="Contoh: Keripik Pisang"

required

>

</div>






<div>

<label>
📂 Kategori
</label>


<input

id="kategori"

placeholder="Contoh: Makanan Ringan"

required

>

</div>






<div>

<label>
📦 Kemasan
</label>


<input

id="kemasan"

placeholder="Contoh: Plastik Vakum"

>

</div>






<div>

<label>
🎨 Warna
</label>


<input

id="warna"

placeholder="Contoh: Kuning Keemasan"

>

</div>






<div>

<label>
👃 Aroma
</label>


<input

id="aroma"

placeholder="Contoh: Normal"

>

</div>






<div>

<label>
✋ Tekstur
</label>


<input

id="tekstur"

placeholder="Contoh: Renyah"

>

</div>



</div>








<label>
📅 Tanggal Produksi
</label>


<input

type="date"

id="tanggal_produksi"

>








<label>
📅 Tanggal Kadaluarsa
</label>


<input

type="date"

id="tanggal_kadaluarsa"

>







<label>
🛡 Hasil Pemeriksaan
</label>



<select id="hasil">


<option value="LAYAK">

🟢 LAYAK - Aman dikonsumsi

</option>



<option value="TIDAK LAYAK">

🔴 TIDAK LAYAK - Membutuhkan perhatian

</option>



</select>








<label>
📝 Catatan Pemeriksaan
</label>



<textarea

id="catatan"

placeholder="Tambahkan catatan hasil pemeriksaan..."

required

></textarea>







<button

type="button"

class="btnSimpan"

onclick="simpanPemeriksaanBaru()"

>

💾 Simpan Pemeriksaan

</button>




</form>




</div>





</div>





</div>








<div id="toast"></div>




<script src="js/config.js"></script>

<script src="js/toast.js"></script>

<script src="js/pemeriksaan.js"></script>


<script>


function logout(){


localStorage.removeItem("token");

localStorage.removeItem("user");


showToast(
"👋 Anda telah keluar",
"success"
);



setTimeout(()=>{

location.href="index.html";

},800);



}



</script>


</body>


</html>
