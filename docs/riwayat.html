<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Riwayat Pemeriksaan - Food Check UMKM
</title>


<link rel="stylesheet" href="css/style.css">

</head>



<body>


<div class="layout">



<!-- =====================
SIDEBAR
===================== -->

<div class="sidebar">


<div class="brand">

<h2>
🛡 Food Check
</h2>

<p>
UMKM
</p>

</div>




<div class="profile">


<div class="avatar" id="avatar">
U
</div>



<div>

<b id="sidebarNama">
User
</b>


<small id="sidebarRole">
Role
</small>


</div>


</div>






<div class="menu">


<button onclick="location.href='dashboard.html'">

🏠 Dashboard

</button>




<button 
id="btnMenuPemeriksaan"
onclick="location.href='pemeriksaan.html'">

🍜 Pemeriksaan

</button>





<button class="active">

📋 Riwayat Pemeriksaan

</button>



</div>







<button 
class="logout"
onclick="logout()">

🚪 Logout

</button>




</div>









<!-- =====================
CONTENT
===================== -->


<div class="content">



<h1>

📋 Riwayat Pemeriksaan

</h1>




<p>

Daftar hasil pemeriksaan keamanan pangan.

</p>









<div class="manage">



<h2>

📊 Data Pemeriksaan

</h2>






<!-- FILTER OWNER -->

<div 
id="ownerFilter"
style="display:none;"
>



<select id="filterMember">


<option value="all">

Semua Member

</option>


</select>






<select id="filterHasil">


<option value="all">

Semua Status

</option>


<option value="LAYAK">

LAYAK

</option>


<option value="TIDAK LAYAK">

TIDAK LAYAK

</option>



</select>







<input

id="searchMakanan"

type="text"

placeholder="Cari nama makanan..."

>






</div>









<!-- DATA CARD -->

<div id="data">


<div class="empty-data">

Memuat data...

</div>


</div>





</div>








</div>









</div>









<!-- =====================
MODAL DETAIL
===================== -->


<div 
id="detailModal"
class="modal"
>


<div class="modal-content">



<h2>

🍜 Detail Pemeriksaan

</h2>




<div id="detailIsi">


</div>






<button 
onclick="tutupDetail()"
>


Tutup


</button>





</div>


</div>









<!-- =====================
SCRIPT
===================== -->


<script src="js/config.js"></script>


<script src="js/toast.js"></script>


<script src="js/detail.js"></script>


<script src="js/riwayat.js"></script>





<script>


function logout(){


localStorage.removeItem("token");


localStorage.removeItem("user");


location.href="index.html";


}


</script>



</body>


</html>
